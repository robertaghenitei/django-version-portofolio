{% load static %}
{% load i18n %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}My Portfolio{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-ENjdO4Dr2bkBIFxQpeoPvQz7sCMEQZ60p3pH5O1FQx74xw1Tzt4vRJEvN8AUyNwZ"
    crossorigin="anonymous"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'startpage/style.css' %}" />
</head>
<body>
  <header class="bg-primary text-white text-center py-5">
    <div class="container">
      <h1>Robert Gabriel Aghenitei</h1>
      <p class="lead">Junior Full Stack Developer</p>
      <nav class="nav justify-content-center">
        <a class="nav-link text-white" href="{% url 'startpage:home' %}">Home</a>
        <a class="nav-link text-white" href="{% url 'startpage:projects' %}">Projects</a>
        <a class="nav-link text-white" href="{% url 'startpage:blog' %}">Blog</a>
        <a class="nav-link text-white" href="{% url 'startpage:cv' %}">CV</a>
        <a class="nav-link text-white" href="{% url 'startpage:contact' %}">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container my-5">
    {% block content %}
    <!-- Page-specific content goes here -->
    {% endblock %}
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 Robert Gabriel Aghenitei</p>
  </footer>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-QF1I1CFU5ep5zv3s/FbR6nTGOz+4c9aeXClVnAwT9pqg8qOdX3HscuwWjTzRAnbK"
    crossorigin="anonymous"
  ></script>

  <!-- Optional: Page-specific JS -->
  <script src="{% static 'startpage/script.js' %}"></script>
</body>
</html>
